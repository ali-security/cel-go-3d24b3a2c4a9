# Authored by agentic-sealer: upstream cel-go has no GitHub Actions CI (its CI is
# Google Cloud Build, cloudbuild.yaml: verify-vendor.sh on golang:1.23.0 + bazel test).
# This workflow builds the Go module zip and runs the root module's `go test` suite
# on the release toolchain (go.mod `go 1.23.0`, MODULE.bazel go_sdk 1.23.0).
name: seal-build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional go test selector (empty = full suite)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  module-zip:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.0"
          cache: false
      - name: Build x/mod zip helper
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/helper"
          cd "$RUNNER_TEMP/helper"
          cat > main.go <<'EOF'
          package main

          import (
              "log"
              "os"

              "golang.org/x/mod/module"
              "golang.org/x/mod/zip"
          )

          func main() {
              f, err := os.Create(os.Args[1])
              if err != nil {
                  log.Fatal(err)
              }
              defer f.Close()
              mv := module.Version{Path: os.Args[2], Version: os.Args[3]}
              if err := zip.CreateFromDir(f, mv, os.Args[4]); err != nil {
                  log.Fatal(err)
              }
          }
          EOF
          go mod init sealhelper
          GOFLAGS=-mod=mod go get golang.org/x/mod@v0.20.0
          go build -o "$RUNNER_TEMP/modzip" .
      - name: Create module zip
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/modsrc" "$RUNNER_TEMP/out"
          tar -C "$GITHUB_WORKSPACE" --exclude=./.git -cf - . | tar -C "$RUNNER_TEMP/modsrc" -xf -
          rm -f "$RUNNER_TEMP/modsrc/.github/workflows/seal-build.yml"
          if [ -z "$(ls -A "$RUNNER_TEMP/modsrc/.github/workflows")" ]; then rmdir "$RUNNER_TEMP/modsrc/.github/workflows"; fi
          "$RUNNER_TEMP/modzip" "$RUNNER_TEMP/out/v0.27.0.zip" github.com/google/cel-go v0.27.0 "$RUNNER_TEMP/modsrc"
          unzip -l "$RUNNER_TEMP/out/v0.27.0.zip" | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: v0.27.0.zip
          path: ${{ runner.temp }}/out/v0.27.0.zip
          if-no-files-found: error

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=vendor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.0"
          cache: false
      - name: Verify vendor directory (upstream cloudbuild step)
        env:
          GOFLAGS: ""
        run: bash scripts/verify-vendor.sh
      - name: Install gotestsum (go test runner that prints a pass/fail/skip summary)
        env:
          GOFLAGS: ""
        run: go install gotest.tools/gotestsum@v1.12.0
      - name: Build
        run: go build ./...
      - name: Test
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            "$(go env GOPATH)/bin/gotestsum" --format standard-verbose -- -run '^(${{ inputs.test-filter }})$' ./...
          else
            "$(go env GOPATH)/bin/gotestsum" --format standard-verbose -- ./...
          fi
